# Weekly check that the built-in provider privacy-policy URLs still resolve.
# Outbound requests happen HERE, in CI — never in the plugin (invariant 9).
# Not a required status check: a provider moving a page is a reason to ship
# a descriptor update, not to block unrelated merges.
name: Privacy-link canary

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every built-in privacy-policy URL
        run: bash bin/check-privacy-links.sh
